<!DOCTYPE html>
<html>
    <body>
        <h2>JS While Loop</h2>
        <p>Instructions for JS class</p>

        <p id="student 1"></p>
        <p id="student 2"></p>

        <script>

            class Student {
                constructor(name, year){
                    this.name =name;
                    this.year =year;
                }


                age() {
                    let date = new Date();
                    return date.getFullYear() - this.year;
                }
            }


            const student1 = new Student("Amanda", 2013);
            document.getElementById("student1").innerHTML =
            "My name is" + student1.name + ". I was born in " + student1.year + ". My age is " + student1;

                        const student2 = new Student("Amy", 2010);
            document.getElementById("student2").innerHTML =
            "My name is" + student2.name + ". I was born in " + student2.year + ". My age is " + student2;
            </script>
        </body>
    </html>
