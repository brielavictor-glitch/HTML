<!DOCTYPE html>
<html>
   <body>
      <h2>Java Script String Methods</h2>
      <p>Basic Methods</p>
      <script>
    var fruits = ["Apple","Dragon fruit","Kiwi","Jack Fuit"];
    var text = "";
    var i;
    for (i = 0; i < fruits.length; i++){
        text += fruits [i] +"<hr>";
    }
    document.getElementById("demo").innerHTML = text;
    </script>
   </body>
</html
